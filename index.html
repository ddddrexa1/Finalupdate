<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MR REAPER | The Elimination Game</title>
<link rel="stylesheet" href="game.css">
</head>
<body>
<div id="toast" class="toast"></div>
<div id="app">
<section id="loginScreen" class="screen active">
  <div class="skull">☠</div><h1>MR REAPER</h1><p class="subtitle">THE ELIMINATION GAME</p>
  <div class="card">
    <input id="playerName" maxlength="20" placeholder="PLAYER NAME" autocomplete="off">
    <button id="createBtn" class="primary">CREATE ROOM</button>
    <div class="or">OR JOIN</div>
    <div class="joinRow"><input id="roomCodeInput" maxlength="5" placeholder="ROOM CODE" autocomplete="off"><button id="joinBtn">JOIN</button></div>
    <div id="statusText" class="status">REAPER CONNECTION: CHECKING</div>
  </div>
</section>
<section id="lobbyScreen" class="screen">
  <header><b>MR REAPER</b><span id="lobbyCode">-----</span></header>
  <div class="card"><h2>LOBBY</h2><div class="code" id="roomCodeDisplay">-----</div><button id="copyCodeBtn">COPY ROOM CODE</button><div id="playerList" class="players"></div><button id="startBtn" class="primary">START GAME</button><button id="leaveBtn">LEAVE ROOM</button><p id="lobbyStatus" class="status">Waiting for players...</p></div>
</section>
<section id="gameScreen" class="screen gameScreen">
  <header><span>ROUND <b id="roundDisplay">1</b></span><span id="gameCode">-----</span><span>ALIVE <b id="aliveCount">0</b></span></header>
  <div class="gameWrap">
    <div class="hud"><span id="phaseLabel">GET READY</span><span id="timerLabel">--</span></div>
    <div id="arena" class="arena"><div id="finishLine"></div><div id="doll">◉</div><div id="playersArena"></div></div>
    <div id="controls" class="controls"><button data-key="up">▲</button><div><button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button></div></div>
    <div class="gameActions"><button id="micBtn">🎙 MIC OFF</button><button id="spectateBtn" class="hidden">SPECTATE</button><button id="leaveGameBtn">LEAVE</button></div>
  </div>
</section>
<section id="spectateScreen" class="screen"><header><b>SPECTATOR</b><span id="spectateCode">-----</span></header><div class="card"><h2>YOU ARE OUT</h2><p>Watch the remaining players.</p><div id="spectateList" class="players"></div><button id="returnLoginBtn">RETURN TO LOGIN</button></div></section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
