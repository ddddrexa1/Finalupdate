<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#050505">

  <title>MR REAPER | The Elimination Game</title>

  <link rel="stylesheet" href="game.css">

  <!-- Supabase -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    defer>
  </script>

  <!-- Our application -->
  <script src="app.js" defer></script>
</head>

<body>

  <!-- =========================================================
       SYSTEM STATUS
  ========================================================== -->

  <div id="systemStatus" class="system-status">
    <span id="statusDot" class="status-dot"></span>
    <span id="statusText">Starting...</span>

    <button
      id="refreshBtn"
      class="refresh-btn"
      type="button"
      aria-label="Refresh page"
    >
      ↻
    </button>
  </div>


  <!-- =========================================================
       ENTRY PAGE
  ========================================================== -->

  <main id="entryPage" class="page active">

    <section class="hero">

      <div class="skull">☠</div>

      <h1>MR REAPER</h1>

      <p class="subtitle">
        THE ELIMINATION GAME
      </p>

      <div class="divider"></div>

      <p class="intro-text">
        Enter the game.<br>
        Survive the rounds.<br>
        Don't get eliminated.
      </p>

    </section>


    <section class="card">

      <h2>ENTER THE GAME</h2>

      <label for="playerNameInput">
        PLAYER NAME
      </label>

      <input
        id="playerNameInput"
        type="text"
        maxlength="20"
        autocomplete="off"
        placeholder="Enter your name"
      >

      <button
        id="createRoomBtn"
        class="primary-btn"
        type="button"
      >
        <span class="btn-text">CREATE ROOM</span>
        <span class="btn-loader"></span>
      </button>

      <div class="or">
        <span>OR</span>
      </div>

      <label for="roomCodeInput">
        ROOM CODE
      </label>

      <input
        id="roomCodeInput"
        type="text"
        maxlength="5"
        autocomplete="off"
        autocapitalize="characters"
        placeholder="ABCDE"
      >

      <button
        id="joinRoomBtn"
        class="secondary-btn"
        type="button"
      >
        <span class="btn-text">JOIN ROOM</span>
        <span class="btn-loader"></span>
      </button>

      <div id="entryMessage" class="message"></div>

    </section>

  </main>


  <!-- =========================================================
       LOBBY PAGE
  ========================================================== -->

  <main id="lobbyPage" class="page">

    <section class="lobby-header">

      <div class="skull small">☠</div>

      <p class="eyebrow">
        MR REAPER
      </p>

      <h1>LOBBY</h1>

      <p id="lobbyMessage" class="lobby-message">
        Waiting for players...
      </p>

    </section>


    <section class="room-code-card">

      <span class="small-label">
        ROOM CODE
      </span>

      <div
        id="roomCodeDisplay"
        class="room-code"
      >
        -----
      </div>

      <button
        id="copyRoomCodeBtn"
        class="copy-btn"
        type="button"
      >
        COPY CODE
      </button>

    </section>


    <section class="players-card">

      <div class="section-title-row">

        <h2>PLAYERS</h2>

        <span
          id="playerCount"
          class="player-count"
        >
          0/30
        </span>

      </div>

      <div
        id="playersList"
        class="players-list"
      >
        <div class="empty-players">
          Waiting for players...
        </div>
      </div>

    </section>


    <section class="lobby-actions">

      <button
        id="startGameBtn"
        class="primary-btn"
        type="button"
      >
        <span class="btn-text">START GAME</span>
        <span class="btn-loader"></span>
      </button>

      <button
        id="leaveRoomBtn"
        class="danger-btn"
        type="button"
      >
        <span class="btn-text">LEAVE ROOM</span>
        <span class="btn-loader"></span>
      </button>

    </section>

  </main>


  <!-- =========================================================
       GAME PAGE
  ========================================================== -->

  <main id="gamePage" class="page">

    <header class="game-header">

      <div>
        <span class="eyebrow">
          MR REAPER
        </span>

        <h1>
          ROUND
          <span id="roundDisplay">1</span>
        </h1>
      </div>

      <div class="game-player-count">
        <span>PLAYERS</span>
        <strong id="gamePlayerCount">0</strong>
      </div>

    </header>


    <section class="game-arena">

      <div class="arena-warning">
        ☠
      </div>

      <h2 id="gameTitle">
        GAME STARTING
      </h2>

      <p id="gameMessage">
        Prepare yourself.
      </p>

      <div class="game-status-light">
        <span id="gameLight"></span>
      </div>

      <div class="arena-floor">

        <div class="player-marker">
          <span>YOU</span>
        </div>

      </div>

    </section>


    <section class="game-actions">

      <button
        id="gameLobbyBtn"
        class="secondary-btn"
        type="button"
      >
        RETURN TO LOBBY
      </button>

      <button
        id="gameLeaveBtn"
        class="danger-btn"
        type="button"
      >
        LEAVE GAME
      </button>

    </section>

  </main>


  <!-- =========================================================
       GLOBAL TOAST
  ========================================================== -->

  <div
    id="toast"
    class="toast"
    aria-live="polite"
  ></div>

</body>
</html>
