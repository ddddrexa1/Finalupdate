<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>MR REAPER | The Elimination Game</title>

  <link rel="stylesheet" href="game.css">

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    defer
  ></script>

  <script src="app.js" defer></script>
</head>

<body>

  <!-- =====================================================
       SYSTEM STATUS
       ===================================================== -->

  <div id="systemStatus" class="system-status">
    <span id="statusDot"></span>
    <span id="statusText">Connecting...</span>
  </div>


  <!-- =====================================================
       REFRESH
       ===================================================== -->

  <button
    id="refreshBtn"
    class="refresh-btn"
    type="button"
  >
    ↻ Refresh
  </button>


  <!-- =====================================================
       ENTRY PAGE
       ===================================================== -->

  <section id="entryPage" class="screen active">

    <div class="entry-container">

      <div class="skull">☠</div>

      <h1>MR REAPER</h1>

      <p class="subtitle">
        THE ELIMINATION GAME
      </p>

      <div class="divider"></div>


      <div class="input-group">

        <label for="playerNameInput">
          PLAYER NAME
        </label>

        <input
          id="playerNameInput"
          type="text"
          maxlength="20"
          autocomplete="off"
          placeholder="Enter your name"
        >

      </div>


      <button
        id="createRoomBtn"
        class="game-btn primary"
        type="button"
      >
        CREATE ROOM
      </button>


      <div class="or">
        OR
      </div>


      <div class="input-group">

        <label for="roomCodeInput">
          ROOM CODE
        </label>

        <input
          id="roomCodeInput"
          type="text"
          maxlength="5"
          autocomplete="off"
          placeholder="ABCDE"
        >

      </div>


      <button
        id="joinRoomBtn"
        class="game-btn"
        type="button"
      >
        JOIN ROOM
      </button>


      <p class="game-info">
        2–30 PLAYERS
      </p>

    </div>

  </section>


  <!-- =====================================================
       LOBBY PAGE
       ===================================================== -->

  <section id="lobbyPage" class="screen">

    <div class="lobby-container">

      <div class="skull small">
        ☠
      </div>

      <h2>
        ROOM LOBBY
      </h2>


      <div class="room-card">

        <span class="room-label">
          ROOM CODE
        </span>

        <strong id="roomCodeDisplay">
          -----
        </strong>

      </div>


      <div class="player-count">

        <span id="playerCount">
          0
        </span>

        PLAYERS
      </div>


      <div
        id="playersList"
        class="players-list"
      >
        <div class="empty-players">
          Waiting for players...
        </div>
      </div>


      <button
        id="startGameBtn"
        class="game-btn primary"
        type="button"
      >
        START GAME
      </button>


      <button
        id="leaveRoomBtn"
        class="game-btn danger"
        type="button"
      >
        LEAVE ROOM
      </button>

    </div>

  </section>


  <!-- =====================================================
       GAME PAGE
       ===================================================== -->

  <section id="gamePage" class="screen">

    <div class="game-container">

      <div class="skull game-skull">
        ☠
      </div>

      <h1>
        MR REAPER
      </h1>

      <p class="game-state">
        THE GAME HAS BEGUN
      </p>


      <div class="game-panel">

        <div class="game-panel-title">
          ROUND
        </div>

        <div
          id="roundDisplay"
          class="round-number"
        >
          1
        </div>

      </div>


      <div class="game-panel">

        <div class="game-panel-title">
          PLAYERS
        </div>

        <div
          id="gamePlayerCount"
          class="round-number"
        >
          0
        </div>

      </div>


      <div
        id="gameMessage"
        class="game-message"
      >
        Prepare yourself...
      </div>


      <button
        id="gameLobbyBtn"
        class="game-btn"
        type="button"
      >
        BACK TO LOBBY
      </button>


      <button
        id="gameLeaveBtn"
        class="game-btn danger"
        type="button"
      >
        LEAVE GAME
      </button>

    </div>

  </section>


</body>
</html>
